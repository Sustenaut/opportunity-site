# The opportunity site on the Sustenaut k3s server (shared-infra's infra/hetzner.tf), namespace
# opportunity: the app, its own PostgreSQL, oauth2-proxy in front of it, the
# ingress for opportunity.sustenaut.eu and a nightly database dump.
# Rendered by .github/workflows/deploy.yml with the image it just built
# (kustomize edit set image) and applied by sustenaut-deploy on the server.
# Not here: the Secrets opportunity-secrets, opportunity-oidc (the sign-in client) and
# opportunity-wal, and the network policy in admin/ (the deploy identity may not manage
# those), which the deploy walk puts in (README.md, "Deploying").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opportunity
resources:
  - service-accounts.yaml
  - postgres.yaml
  - app.yaml
  - oauth2-proxy.yaml
  - ingress.yaml
  - backup.yaml
# The app's hardening and probes, shared by every service (pubkit's README, "Deploying a
# service to k3s"). PostgreSQL and oauth2-proxy keep their own.
components:
  - https://github.com/Sustenaut/pubkit//k8s/components/app?ref=c7785ba2f32bd5c5a78053e9bfeaa1f966ae36f1 # v0.30.0
images:
  - name: ghcr.io/sustenaut/sustenaut-opportunity
    newTag: unset
  # Sustenaut/pg-backup's release: PostgreSQL 16.14 with WAL-G. Move it with backups/pg-backup's
  # version and infra/'s module ref.
  - name: ghcr.io/sustenaut/pg-backup
    newTag: 0.1.0-pg16
    digest: sha256:1cdc1121515180f8e744fc36a343b546e89b77cb28bacaaddb1f3666f4048b09
