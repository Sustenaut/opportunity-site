# The site's own database: comment threads and reviews. Only the app (and the
# nightly dump) may reach it (admin/network-policy.yaml). Its volume is on the
# server's data volume (k3s local-path, under /mnt/data/k3s), so it survives a
# server rebuild; nightly dumps go off-box (backup.yaml).
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16.14
          env:
            - name: POSTGRES_DB
              value: opportunity
            - name: POSTGRES_USER
              value: opportunity
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opportunity-secrets
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "opportunity", "-d", "opportunity"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
