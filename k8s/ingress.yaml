# opportunity.sustenaut.eu through the server's shared Traefik, with a Let's
# Encrypt certificate (resolver "letsencrypt", set up in infra/cloud-init).
# Everything goes to oauth2-proxy; nothing routes to the app directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opportunity
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: opportunity.sustenaut.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  name: http
  tls:
    - hosts:
        - opportunity.sustenaut.eu
