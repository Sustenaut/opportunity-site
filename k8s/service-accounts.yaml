# The app's own service account, for its storage.sustenaut.eu token alone: no
# RBAC binds it, and nothing mounts an API token (app.yaml projects only a
# token for the audience storage.sustenaut.eu, which storage takes as the
# principal k8s:opportunity/app). The namespace's default account mounts
# none either, so no pod here gets an API token by accident.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
automountServiceAccountToken: false
