# Build and deploy the opportunity site (opportunity.sustenaut.eu) once CI passes on a
# merge to main, or by hand, with pubkit's k8s-deploy.yml (pubkit's README, "Deploying
# a service to k3s"). The image goes to GitHub's container registry and holds no cards
# and no bizplan: the site reads both from its checkout of business-plan. Then the
# manifests in k8s/, rendered with that image, go to the Sustenaut k3s server
# (shared-infra's infra/hetzner.tf) over SSH and the tailnet, where the deploy key can
# only run sustenaut-deploy: apply in namespace opportunity and wait.
#
# Needs the same secrets and variables as Sustenaut/auth's auth.yml
# (Sustenaut/auth's README.md, "Deploying"). Without SUSTENAUT_SERVER the image is
# built and pushed, and nothing is deployed.
name: deploy

on:
  # Once CI (main.yml) has passed on a merge to main, never beside it; k8s-deploy's
  # ready job also waits for the integrations check on that commit.
  workflow_run: { workflows: [main], types: [completed], branches: [main] }
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  deploy:
    uses: Sustenaut/pubkit/.github/workflows/k8s-deploy.yml@0c1f1c3ff98315c6eabad6b58ba9fad79374572a # v0.31.0
    with:
      image: ghcr.io/sustenaut/sustenaut-opportunity
      deploys: k8s opportunity
      # The image must start, hold what the app imports and what bizplan needs,
      # and hold no bizplan: that comes from the checkout at runtime.
      check: |
        docker run --rm "$IMAGE" python -c '
        import importlib.util, opportunity.main, psycopg, pandas, yaml
        from pathlib import Path
        assert importlib.util.find_spec("bizplan") is None
        assert sorted(p.name for p in Path("opportunity/migrations").glob("*.sql"))'
        docker run --rm --entrypoint git "$IMAGE" --version
    secrets: inherit
